<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reporte de Vulnerabilidades - Docente</title>
    <link rel="stylesheet" href="css/repo_styles.css" />
    <link rel="stylesheet" href="css/dark-mode-base.css" />
    <link rel="stylesheet" href="css/dark-mode-reporte.css" />
    <style>
      /* Estilos específicos para la vista de docente */
      .info-estudiante {
        margin-bottom: 20px;
      }

      .student-info-card {
        animation: fadeIn 0.5s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .student-info-card h3 {
        border-bottom: 2px solid var(--primary-color, #667eea);
        padding-bottom: 8px;
      }

      .student-info-card p {
        font-size: 0.9rem;
        line-height: 1.6;
      }

      .student-info-card strong {
        color: var(--primary-color, #667eea);
      }
    </style>

    <!-- Prism.js para resaltado -->
    <link
      href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>

    <!-- JS funciones -->
    <script src="js/api-service.js" defer></script>
    <script src="js/autenticacion.js" defer></script>
    <script src="js/reporte-docente.js" defer></script>
    <script src="js/dark-mode.js" defer></script>
  </head>
  <body>
    <div class="hero">
      <div class="navbar">
        <span class="navbar-title">BlackQuery - Vista Docente</span>
        <div style="display: flex; gap: 10px">
          <button onclick="window.history.back()" class="btn panel">
            ⬅️ Atrás
          </button>
          <button onclick="logout()" class="btn logout">Cerrar sesión</button>
        </div>
      </div>

      <div class="container">
        <!-- Sidebar -->

        <!-- Contenido principal -->
        <div class="content">
          <div class="sidebar">
            <div class="info-estudiante" id="info-estudiante">
              <!-- Información del estudiante se cargará aquí -->
            </div>
            <div class="menu">
              <ul id="lista-archivos">
                <!-- Lista dinámica -->
              </ul>
            </div>
          </div>
          <div class="code-viewer">
            <div class="editor-header">
              <div class="dot red"></div>
              <div class="dot yellow"></div>
              <div class="dot green"></div>
            </div>
            <pre
              class="line-numbers"
            ><code id="codigo" class="language-java">// Selecciona un archivo para ver su código</code></pre>
          </div>

          <div class="report-section">
            <h2>Vulnerabilidades encontradas</h2>
            <div id="report-container"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
